type: architecture
title: MeetPulse Desktop — arquitectura
description: "Arquitectura de la app de escritorio MeetPulse: interfaz, nucleo Rust, almacenamiento local y gateway cloud opcional."
direction: RIGHT
font: mixed
nodes:
  - id: desktop
    label: MeetPulse · desktop app
    kind: onprem
    children:
      - id: interface
        label: Interface
        sublabel: Next.js · React · TS
        icon: lu-monitor
        variant: stacked
        tone: accent
      - id: rustcore
        label: Rust core
        sublabel: Tauri 2
        kind: group
        icon: lu-cog
        variant: stacked
        children:
          - id: audio
            label: Audio
            sublabel: cpal · WASAPI · VAD
            icon: lu-mic
            variant: stacked
          - id: transcription
            label: Transcription
            sublabel: Whisper · Parakeet
            icon: lu-languages
            variant: stacked
          - id: data
            label: Data
            sublabel: sqlx · migrations
            kind: group
            icon: lu-hard-drive
            variant: stacked
            description: Accede a SQLite con sqlx (consultas y migraciones).
            children:
              - id: sqlite
                label: SQLite
                sublabel: FTS5 · e5 embeddings
                icon: lu-database
                variant: stacked
                kind: database
                tone: data
          - id: summary
            label: Summary & assistant
            sublabel: templates · chat · coach
            kind: group
            icon: lu-sparkles
            variant: stacked
            description: Para inferencia local invoca llama-helper por stdin/stdout.
            children:
              - id: llama
                label: llama-helper
                sublabel: child process · llama.cpp
                icon: lu-terminal
                variant: stacked
                kind: compute
      - id: cloud
        label: Optional cloud
        kind: cloud
        children:
          - id: vercel
            label: Vercel AI Gateway
            sublabel: HTTPS · your API key
            icon: lu-cloud
            variant: stacked
            tone: network
edges:
  - { from: interface, to: rustcore, label: invoke · emit, both: true }
  - { from: audio, to: transcription, label: audio segments }
  - { from: transcription, to: data, label: transcript }
  - { from: transcription, to: summary, label: transcript }
  - { from: summary, to: data, label: context, style: dashed }
  - { from: transcription, to: vercel, label: audio stream, style: dashed }
  - { from: summary, to: vercel, label: text stream, style: dashed }
legend:
  - { style: solid, label: Siempre local }
  - { style: dashed, label: Opcional / modo cloud }
variants:
  narrow:                      # phone: containers of the Rust core collapse into single boxes, Data beside Summary (no edge loops)
    direction: DOWN
    notesPosition: below
    hide: [sqlite, llama]
    nodes:
      interface: { sublabel: Next.js · React }
      audio: { sublabel: cpal · VAD }
      transcription: { sublabel: Whisper · Parakeet }
      data: { label: Data, sublabel: SQLite · FTS5, stackWith: summary }
      summary: { label: Summary, sublabel: llama.cpp }
      vercel: { sublabel: HTTPS }
